name: Release Debian Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  deb:
    name: Build and publish DEB
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates \
            build-essential \
            cmake \
            dpkg-dev \
            extra-cmake-modules \
            git \
            libkf6coreaddons-dev \
            libkf6declarative-dev \
            qt6-base-dev \
            qt6-base-dev-tools

      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "Release tags must use v<version>, for example v0.1.0; got ${TAG_NAME}." >&2
            exit 1
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DSUISHI_VERSION="${VERSION}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir --parents dist
          cpack --config build/CPackConfig.cmake -B dist
          sha256sum dist/*.deb > dist/SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suishi-deb-${{ github.ref_name }}
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 岁时 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/SHA256SUMS
